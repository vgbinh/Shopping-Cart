<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #fff;
      color: #333;
    }
    .product {
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    select, button {
      margin-top: 10px;
      padding: 6px;
    }
    #cart {
      border-top: 2px dashed #aaa;
      padding-top: 20px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>🛍️ Phone Cases</h1>

  <div class="product">
    <h3>CherryPop Case</h3>
    <p>Price: 250,000 VND</p>
    <label for="size1">Choose size:</label>
    <select id="size1">
      <option>iPhone 14</option>
      <option>iPhone 15</option>
      <option>iPhone 16</option>
    </select>
    <button onclick="addToCart('CherryPop Case', 250000, document.getElementById('size1').value)">Add to Cart</button>
  </div>

  <div class="product">
    <h3>Barbie Blush Case</h3>
    <p>Price: 280,000 VND</p>
    <label for="size2">Choose size:</label>
    <select id="size2">
      <option>iPhone 14</option>
      <option>iPhone 15</option>
      <option>iPhone 16</option>
    </select>
    <button onclick="addToCart('Barbie Blush Case', 280000, document.getElementById('size2').value)">Add to Cart</button>
  </div>

  <div id="cart">
    <h2>Your Cart 🧺</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total: <span id="total">0</span> VND</strong></p>
    <button onclick="checkout()">Checkout</button>
  </div>

  <script>
    let cart = [];

    function addToCart(name, price, size) {
      cart.push({ name, price, size });
      renderCart();
    }

    function renderCart() {
      const cartList = document.getElementById("cart-items");
      const totalField = document.getElementById("total");
      cartList.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name} - ${item.size} - ${item.price.toLocaleString()} VND`;
        cartList.appendChild(li);
        total += item.price;
      });
      totalField.textContent = total.toLocaleString();
    }

    function checkout() {
      alert("Thanks for your order! We will contact you soon.");
      cart = [];
      renderCart();
    }
  </script>

</body>
</html>
